# Netlify configuration for plainly.chat (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/, /docs/*, /app/*) is served by index.html and handled by React Router.
# Real files in dist (assets, sitemap.xml, robots.txt, og-image.png, brand/*) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
